name: Verify CareerBrand AI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and integration tests
        run: npm test
      - name: Run local website smoke tests without external APIs
        run: npm run smoke
